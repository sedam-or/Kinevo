[package]
name = "kinevo-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
testing = [
    "dep:futures",
    "dep:testcontainers",
    "kinevo-kernel/testing",
]

[dependencies]
async-trait = "0.1.92"
kinevo-kernel.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
serde_json = "1.0.154"
futures = { version = "0.3.34", optional = true }
testcontainers = { version = "0.28.0", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
