[package]
name = "kinevo-mod-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
kinevo-kernel.workspace = true
kinevo-ports.workspace = true
kinevo-db.workspace = true
kinevo-http.workspace = true
getrandom = "0.4.3"
moka = { version = "0.12.16", features = ["future", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros", "uuid"] }
toml = { version = "1.1.8", features = ["parse", "serde"] }
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["sync"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }

[dev-dependencies]
futures = "0.3.34"
kinevo-db = { workspace = true, features = ["testing"] }
kinevo-ports = { workspace = true, features = ["testing"] }
kinevo-mod-identity = { path = "../kinevo-mod-identity" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[lints]
workspace = true
