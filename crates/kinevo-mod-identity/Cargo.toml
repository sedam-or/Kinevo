[package]
name = "kinevo-mod-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kinevo-kernel.workspace = true
kinevo-ports.workspace = true
kinevo-db.workspace = true
kinevo-http.workspace = true
async-trait = "0.1.92"
axum = "0.8.9"
moka = { version = "0.12.16", features = ["future"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros", "uuid"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
utoipa = "6.0.0"
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[dev-dependencies]
futures = "0.3.34"
kinevo-db = { workspace = true, features = ["testing"] }
kinevo-ports = { workspace = true, features = ["testing"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"

[lints]
workspace = true
