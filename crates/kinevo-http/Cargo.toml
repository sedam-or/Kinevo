[package]
name = "kinevo-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
kinevo-kernel.workspace = true
kinevo-ports.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "trace"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[features]
default = []
testing = []

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[lints]
workspace = true
