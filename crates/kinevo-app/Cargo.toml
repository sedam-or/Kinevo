[package]
name = "kinevo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "kinevo"

[features]
e2e = ["kinevo-kernel/testing"]

[[bin]]
name = "kinevo"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
kinevo-kernel.workspace = true
kinevo-ports.workspace = true
kinevo-db.workspace = true
kinevo-http.workspace = true
kinevo-mod-identity.workspace = true
kinevo-mod-admin.workspace = true
jiff = "0.2.38"
getrandom = "0.4.3"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
kinevo-db = { workspace = true, features = ["testing"] }

[lints]
workspace = true
