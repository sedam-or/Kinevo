name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint / analyse / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint (style lint)
        run: vendor/bin/pint --test

      - name: Run PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit

  repo:
    name: Repository baseline validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate repository structure
        run: ./scripts/validate-repo.sh .

      - name: Scan for committed secrets
        run: ./scripts/check-secrets.sh .

      - name: Check documentation links
        run: ./scripts/check-doc-links.sh .

      - name: Check OpenAPI contract structure
        run: ./scripts/check-openapi.sh .

      - name: Check task board consistency
        run: ./scripts/status.sh .
