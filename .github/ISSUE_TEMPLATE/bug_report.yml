name: Bug Report
description: Report a bug in LIFESYNC OS
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Do not include secrets, tokens, private notes, or production data.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker/PHP versions, deployment profile (Docker compose, VPS, etc.)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Application version
      description: From CHANGELOG.md or git tag.
    validations:
      required: true
  - type: input
    id: srs-version
    attributes:
      label: SRS version
      description: Version header in docs/SRS.md.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs WITHOUT secrets. Redact anything sensitive.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional; add when the bug is visual.
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How does this affect your use?
      options:
        - Blocking (core workflow broken)
        - Major (workflow impaired)
        - Minor (cosmetic or edge case)
    validations:
      required: true