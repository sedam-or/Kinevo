# Kinevo reverse proxy — TLS termination + routing to the app php-fpm
# (SRS NFR-02 HTTPS/TLS, deployment.md reverse-proxy role, TASK-081).
# Public 80/443 only; the app, PostgreSQL, and Ollama stay internal.

# HTTP → HTTPS redirect (except Let's Encrypt challenge on port 80).
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};

    # ACME challenge endpoint served directly (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${SERVER_NAME}$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    # TLS certificates (mounted; provisioned by certbot, TASK-081).
    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (NFR-02).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/html/public;
    index index.php;

    # Large static/binary assets and long-running requests.
    client_max_body_size 20M;

    # Vite-built assets (fingerprinted, cacheable).
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker (short-lived cache control).
    location = /sw.js {
        expires 0;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Well-known ACME challenge on 443 (harmless).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (Laravel /up).
    location = /up {
        try_files $uri @app;
    }

    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}
