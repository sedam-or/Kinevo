services:
  app:
    build:
      context: ./docker
    image: lifesync-app:dev
    working_dir: /var/www/html
    volumes:
      - ../server:/var/www/html
      - ../database:/var/www/database
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: lifesync
      DB_USERNAME: lifesync
      DB_PASSWORD: secret
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifesync
      POSTGRES_USER: lifesync
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - lifesync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifesync -d lifesync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lifesync_pgdata:
