services:
  app:
    build:
      context: ./docker
    image: kinevo-app:dev
    working_dir: /var/www/html
    volumes:
      - ../server:/var/www/html
      - ../database:/var/www/database
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kinevo
      DB_USERNAME: kinevo
      DB_PASSWORD: secret
      DB_SSLMODE: disable
      # Local models load on demand (ADR-011): a cold 7B can take minutes,
      # so the provider HTTP budget must exceed any 30s-style default.
      AI_TIMEOUT_SECONDS: 300
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kinevo
      POSTGRES_USER: kinevo
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - kinevo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinevo -d kinevo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional local AI inference for development (docs/deployment.md,
  # SRS §13.6, ADR-011). Opt-in via: docker compose --profile ai up -d
  # Internal network only — no host port published; the app reaches it at
  # http://ollama:11434. The app stays fully operational without it (FR-60).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - kinevo_ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Unload models after 30 min of inactivity (load-on-demand posture).
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kinevo_pgdata:
  kinevo_ollama:
