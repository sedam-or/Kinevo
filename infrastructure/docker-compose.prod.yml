# Kinevo production compose (deployment.md "Production containers").
# Roles: reverse-proxy (nginx TLS, TASK-081), app (php-fpm), queue-worker,
# scheduler, postgres, optional ollama. Public 80/443 enter only via the
# reverse proxy; the app, PostgreSQL, and Ollama stay internal (SRS §16.4).
# Migrations run explicitly as a release step (`make prod-migrate`).
#
# Secrets are injected via the environment (platform secret store), never baked
# into the image. APP_KEY / DB_PASSWORD / SERVER_NAME MUST be provided at deploy.

name: kinevo-prod

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: "${SERVER_NAME:?SERVER_NAME is required (e.g. kinevo.example.com)}"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  # Let's Encrypt ACME companion (webroot). Run once per domain, then the
  # reverse proxy serves the certificates. See docs/deployment.md TASK-081.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles: ["certbot"]
    restart: "no"

  app:
    image: kinevo-app:prod
    build:
      context: ../.
      dockerfile: infrastructure/docker/Dockerfile.prod
    environment: &app_env
      APP_ENV: production
      APP_DEBUG: "false"
      # REQUIRED at deploy: APP_KEY, APP_URL, DB_PASSWORD, DB_HOST, etc.
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kinevo
      DB_USERNAME: kinevo
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      AI_PROVIDER: "${AI_PROVIDER:-disabled}"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # FPM listens on :9000; reverse proxy (TASK-081) routes to it. No public
    # host port published here.

  queue-worker:
    image: kinevo-app:prod
    command: queue-worker
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: kinevo-app:prod
    command: scheduler
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kinevo
      POSTGRES_USER: kinevo
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - kinevo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinevo -d kinevo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Daily database backup (SRS §16.4, NFR-05, TASK-082). Runs scripts/backup.sh
  # on a schedule inside the postgres image (which ships pg_dump/psql). Backups
  # are written to a named volume; copy off-box via --remote-bucket for the
  # required remote backup copy.
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1
        while true; do
          /backup/backup.sh || echo "[backup] run failed; retrying next cycle"
          sleep 86400
        done
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kinevo
      DB_USERNAME: kinevo
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      BACKUP_DIR: /backups
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
      REMOTE_BUCKET: "${REMOTE_BUCKET:-}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
    volumes:
      - ./scripts/backup.sh:/backup/backup.sh:ro
      - ./scripts/restore.sh:/backup/restore.sh:ro
      - kinevo_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional local AI inference (opt-in). Internal network only.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - kinevo_ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kinevo_pgdata:
  kinevo_ollama:
  kinevo_backups:
  certbot_conf:
  certbot_www:
