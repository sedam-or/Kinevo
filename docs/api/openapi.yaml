    post:
      tags: [Execution]
      summary: Complete an execution timer (TASK-120)
      description: >-
        Records a focus session from the tracked duration (FR-05: recorded is
        the tracked duration), then transitions the task: completed when no
        subtasks remain, otherwise partial-completed with a scheduled
        continuation. Appends the corresponding activity and progress events.
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCompleteResponse'
        '401': { description: Unauthorized }
        '404': { description: Execution session not found }
        '422': { description: Session is not running or paused }

