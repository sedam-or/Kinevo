  /recharge/{sessionId}/pause:
    post:
      tags: [Recharge]
      summary: Pause a running recharge timer (FR-05)
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Recharge session not found }
        '422': { description: Session is not running }

  /recharge/{sessionId}/resume:
    post:
      tags: [Recharge]
      summary: Resume a paused recharge timer (FR-05)
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Recharge session not found }
        '422': { description: Session is not paused }

  /recharge/{sessionId}/complete:
    post:
      tags: [Recharge]
      summary: Complete a recharge timer (FR-05)
      description: >-
        Records the tracked duration as the recharge duration (never the nominal
        15 minutes). The duration contributes to RechargeMinutes and the
        Work-Life Ratio.
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Recharge session not found }
        '422': { description: Session is not running or paused }

  /recharge/{sessionId}/abandon:
    post:
      tags: [Recharge]
      summary: Abandon an active recharge timer (FR-05)
      description: >-
        Ends the timer without recording any recharge duration.
      responses:
        '200':
          description: Abandoned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Recharge session not found }
        '422': { description: Session is not running or paused }

  /progress:
    get:
      tags: [Progress]
      summary: List meaningful progress events (SRS §6.8)
      description: >-
        Append-only informational feed of meaningful progress. Events are
        generated from domain changes (task completed, milestone
        advanced/completed) or recorded manually (evidence attached,
        experiment recorded, goal progress). They never overwrite activity logs.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: event_type
          in: query
          schema:
            type: string
            enum: [task_completed, milestone_advanced, milestone_completed, evidence_attached, experiment_recorded, goal_progress]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEventListResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }
    post:
      tags: [Progress]
      summary: Record a manual progress event (SRS §6.8)
      description: >-
        Records evidence_attached / experiment_recorded / goal_progress events
        that are not derived from a status change. Informational only;
        entity references are advisory, not authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressEventCreateRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEventResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }

  /ai/status:
    get:
      tags: [AI]
      summary: AI provider status (SRS §17.8 telemetry)
      description: >-
        Safe provider metadata snapshot (provider, model, availability,
        latency, error). Never includes private content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusResponse'
        '401': { description: Unauthorized }

  /ai/config:
    get:
      tags: [AI]
      summary: Masked AI provider configuration (design.md §104)
      description: >-
        Persisted provider settings for the Settings → AI & Providers surface.
        The API key is NEVER returned: only `has_api_key` and a masked hint
        (`…last4`). Status derives from GET /ai/status.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderConfigResponse'
        '401': { description: Unauthorized }
    put:
      tags: [AI]
      summary: Save AI provider configuration
      description: >-
        Replace-only API key semantics: send `api_key` to store a new encrypted
        key or `remove_api_key: true` to clear it. Saved keys are never echoed.
        OpenAI requires a stored key; Ollama requires none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderConfigRequest'
      responses:
        '200':
          description: Saved (masked response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderConfigResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }

  /ai/config/test:
    post:
      tags: [AI]
      summary: Test candidate provider connection without saving
      description: >-
        Pings the provider using CANDIDATE settings so the user can verify
        before saving. Never persists anything and never returns the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: {type: string, enum: [disabled, ollama, openai]}
                base_url: {type: string, maxLength: 255}
                model: {type: string, maxLength: 128}
                api_key: {type: string, maxLength: 4096}
      responses:
        '200':
          description: Ping result (available may be false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }

  /ai/generate:
    post:
      tags: [AI]
      summary: Generate non-mutating AI text for an allowed role (SRS FR-60)
      description: >-
        Free-text generation through the configured provider (Ollama, an
        external OpenAI-compatible provider, mock, or disabled). This endpoint
        is non-mutating: AI output never reaches persistence without the
        structured-output validation and approval flow (FR-61/62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }
        '503':
          description: AI provider unavailable (AI_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/proposals:
    post:
      tags: [AI]
      summary: Generate a schema-validated structured proposal (SRS FR-61, §13.3)
      description: >-
        Runs the configured provider and validates the output against the
        versioned schema for the proposal type. Malformed or invalid output is
        rejected with 422 AI_OUTPUT_INVALID and never reaches persistence as a
        domain mutation. Every run is audited in ai_runs (§7.7). The returned
        proposal awaits the user's approval decision (FR-62); nothing is
        applied here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProposalRequest'
      responses:
        '200':
          description: Validated proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'
        '401': { description: Unauthorized }
        '422':
          description: Invalid payload or AI_OUTPUT_INVALID
        '503':
          description: AI provider unavailable (AI_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [AI]
      summary: List the owner's AI proposals (FR-62 inbox)
      parameters:
        - name: proposal_type
          in: query
          schema:
            type: string
            enum: [goal_breakdown, milestone, task_extraction, canvas, summary]
        - name: decision
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, edited]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }

  /ai/proposals/{proposalId}:
    get:
      tags: [AI]
      summary: View one proposal (FR-62 preview)
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }

  /ai/proposals/{proposalId}/accept:
    post:
      tags: [AI]
      summary: Accept a pending proposal and apply it (FR-62)
      description: >-
        Applies the validated proposal as a domain mutation. Goal breakdown
        proposals create the referenced Goal's Milestones; task extraction
        proposals create Tasks; canvas proposals create a Canvas — each within
        a transaction. Only schema-validated proposals exist in the table, so
        accepting never persists malformed AI output (FR-61).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [milestones]
                    properties:
                      milestones:
                        type: array
                        items: {$ref: '#/components/schemas/Milestone'}
                  - type: object
                    required: [tasks]
                    properties:
                      tasks:
                        type: array
                        items: {$ref: '#/components/schemas/Task'}
                  - type: object
                    required: [canvas]
                    properties:
                      canvas: {$ref: '#/components/schemas/Canvas'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }
        '422': { description: Not pending or unsupported type }

  /ai/proposals/{proposalId}/reject:
    post:
      tags: [AI]
      summary: Reject a pending proposal (FR-62)
      description: Rejection creates no domain mutation (FR-62 acceptance criterion).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }
        '422': { description: Not pending }

  /ai/summarize-note:
    post:
      tags: [AI]
      summary: Generate a note summarization proposal (SRS §13.3)
      description: >-
        Sends only the owner's note plain-text content (context-budgeted,
        SRS §13.4), validates the AI output against the summary schema (FR-61),
        and stores it as a PENDING proposal. Informational; no mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note_id]
              properties:
                note_id: {type: integer}
                instructions: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Note not found }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/extract-tasks:
    post:
      tags: [AI]
      summary: Generate a task extraction proposal from a note (SRS §13.3, §17.4 #5)
      description: >-
        Sends only the owner's note plain-text content (context-budgeted,
        SRS §13.4), validates the AI output against the task extraction schema
        (FR-61), and stores it as a PENDING proposal. Tasks are created only
        after the user accepts (FR-62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note_id]
              properties:
                note_id: {type: integer}
                instructions: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Note not found }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/suggest-canvas:
    post:
      tags: [AI]
      summary: Generate a canvas generation proposal (SRS §13.3 CanvasProposal)
      description: >-
        Generates a proposed canvas title and sections from the user prompt,
        validates the output against the canvas schema (FR-61), and stores it
        as a PENDING proposal. The Canvas is created only after the user
        accepts (FR-62); Excalidraw scene serialization stays an editor concern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, maxLength: 8000}
                system_prompt: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/runs:
    get:
      tags: [AI]
      summary: List the owner's AI run audit records (SRS §7.7)
      parameters:
        - name: proposal_type
          in: query
          schema:
            type: string
            enum: [goal_breakdown, milestone, task_extraction, canvas, summary]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunsResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 255}
    RegisterResponse:
      type: object
      required: [user, token, profile]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
        profile: {$ref: '#/components/schemas/Profile'}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    LoginResponse:
      type: object
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
    Profile:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, default: en}
        timezone: {type: string, default: UTC}
        week_start_day: {type: string, enum: [monday, sunday, saturday], default: monday}
    ProfileUpdateRequest:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, maxLength: 10}
        timezone: {type: string, maxLength: 64}
        week_start_day: {type: string, enum: [monday, sunday, saturday]}
    TaskCreateRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3, default: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
    TaskUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
    TaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [backlog, scheduled, in_progress, partial, continued, completed, skipped, missed, conflict]}
    Task:
      type: object
      required: [id, title, status, priority_tier, version]
      properties:
        id: {type: integer}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        status: {type: string, enum: [backlog, scheduled, in_progress, partial, continued, completed, skipped, missed, conflict]}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
        progress_mode: {type: string, enum: [derived, manual], default: derived}
        progress: {type: integer, minimum: 0, maximum: 100, default: 0}
        version: {type: integer}
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: {$ref: '#/components/schemas/Task'}
    QuickCaptureRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        size: {type: string, enum: [cepat, sedang, berat]}
        duration_minutes: {type: integer, minimum: 1, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        date: {type: string, format: date, nullable: true}
    QuickCaptureResponse:
      type: object
      required: [task, placed, code, strategies]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        placed: {type: boolean}
        assignment: {$ref: '#/components/schemas/ScheduleAssignment', nullable: true}
        code: {type: string, enum: [PLACED, TASK_NO_CAPACITY]}
        strategies:
          type: array
          items: {type: string, enum: [manual_swap, auto_swap, schedule_later]}
    AutoSwapRequest:
      type: object
      required: [date, duration_minutes]
      properties:
        date: {type: string, format: date}
        duration_minutes: {type: integer, minimum: 1}
    AutoSwapResponse:
      type: object
      required: [task, applied, explanation]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        applied: {type: boolean}
        assignment: {$ref: '#/components/schemas/ScheduleAssignment', nullable: true}
        swapped_task: {$ref: '#/components/schemas/Task', nullable: true}
        moved_from:
          type: object
          nullable: true
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        moved_to:
          type: object
          nullable: true
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        explanation: {type: string}
    ScheduleAssignment:
      type: object
      required: [id, user_id, task_id, date, start_at, end_at, duration_minutes, status, source, schedule_version, locked, version]
      properties:
        id: {type: integer}
        user_id: {type: integer}
        task_id: {type: integer}
        date: {type: string, format: date}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        duration_minutes: {type: integer, minimum: 1}
        status: {type: string, enum: [scheduled, completed, cancelled, missed]}
        source: {type: string, enum: [draft, manual, reschedule, override, quick_capture, auto_swap, recurring, mini_pause, emergency_pause]}
        schedule_version: {type: integer}
        locked: {type: boolean}
        version: {type: integer}
    ScheduleEvent:
      type: object
      properties:
        assignment: {$ref: '#/components/schemas/ScheduleAssignment'}
        locked: {type: boolean}
        conflict: {type: boolean}
        task: {$ref: '#/components/schemas/Task', nullable: true}
        program: {type: object, nullable: true}
        goal: {type: object, nullable: true}
        milestone: {type: object, nullable: true}
    EmptySlot:
      type: object
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        duration_minutes: {type: integer}
    CapacityIndicators:
      type: object
      properties:
        scheduled_minutes: {type: integer}
        available_minutes: {type: integer}
        overload_minutes: {type: integer}
        status: {type: string, enum: [ok, overload]}
    TodayResponse:
      type: object
      required: [date, schedule_version, events, empty_slots, hard_landscape, capacity]
      properties:
        date: {type: string, format: date}
        schedule_version: {type: integer}
        pause: {$ref: '#/components/schemas/PauseEvent', nullable: true}
        break: {$ref: '#/components/schemas/BreakPeriod', nullable: true}
        events:
          type: array
          items: {$ref: '#/components/schemas/ScheduleEvent'}
        empty_slots:
          type: array
          items: {$ref: '#/components/schemas/EmptySlot'}
        hard_landscape:
          type: array
          items: {type: object}
        capacity: {$ref: '#/components/schemas/CapacityIndicators'}
    ScheduleResponse:
      type: object
      required: [from, to, schedule_version, events]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        schedule_version: {type: integer}
        events:
          type: array
          items: {$ref: '#/components/schemas/ScheduleEvent'}
    ScheduleDraftRequest:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
    DraftAssignment:
      type: object
      required: [task_id, title, start, end]
      properties:
        task_id: {type: string}
        title: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    UnassignedTask:
      type: object
      required: [task_id, title, reason]
      properties:
        task_id: {type: string}
        title: {type: string}
        reason: {type: string}
    ScheduleDraftResponse:
      type: object
      required: [draft, base_version]
      properties:
        draft:
          type: object
          properties:
            assignments:
              type: array
              items: {$ref: '#/components/schemas/DraftAssignment'}
            unassigned:
              type: array
              items: {$ref: '#/components/schemas/UnassignedTask'}
        base_version: {type: integer}
    ScheduleDraftApplyRequest:
      type: object
      required: [draft, base_version]
      properties:
        draft: {$ref: '#/components/schemas/ScheduleDraft'}
        base_version: {type: integer}
    ScheduleDraft:
      type: object
      required: [assignments, unassigned]
      properties:
        assignments:
          type: array
          items: {$ref: '#/components/schemas/DraftAssignment'}
        unassigned:
          type: array
          items: {$ref: '#/components/schemas/UnassignedTask'}
    ScheduleApplyResultResponse:
      type: object
      required: [version, applied, assignments]
      properties:
        version: {type: integer}
