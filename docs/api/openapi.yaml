openapi: 3.1.0
info:
  title: LIFESYNC OS API
  version: 2.0.0
  description: |
    Versioned REST API for LIFESYNC OS. Business mutations are validated server-side,
    support operation identifiers, and use stable error codes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Today
  - name: Identity
  - name: Tasks
  - name: Goals
  - name: Milestones
  - name: Programs
  - name: Scheduling
  - name: Knowledge
  - name: Canvas
  - name: AI
  - name: Offline

paths:
  /today:
    get:
      tags: [Today]
      summary: Get canonical Today schedule
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /auth/register:
    post:
      tags: [Identity]
      summary: Register the first owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409': { description: Owner account already exists }
        '422': { description: Validation error }

  /auth/login:
    post:
      tags: [Identity]
      summary: Authenticate the owner and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { description: Invalid credentials }
        '422': { description: Validation error }

  /auth/me:
    get:
      tags: [Identity]
      summary: Get the authenticated owner identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401': { description: Unauthorized }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current bearer token
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /profile:
    get:
      tags: [Identity]
      summary: Get the owner profile/settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
    put:
      tags: [Identity]
      summary: Update the owner profile/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /tasks:
    post:
      tags: [Tasks]
      summary: Create or Quick Capture a task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201': { description: Created }
        '409': { description: Conflict }
        '422': { description: Business rule violation }

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      responses: {'200': {description: OK}}
    post:
      tags: [Goals]
      summary: Create goal
      responses: {'201': {description: Created}}

  /goals/{goalId}/breakdown-proposals:
    post:
      tags: [Goals]
      summary: Generate milestone/work breakdown proposal
      responses: {'202': {description: Proposal generation accepted}}

  /milestones:
    post:
      tags: [Milestones]
      summary: Create milestone
      responses: {'201': {description: Created}}

  /schedule/auto:
    post:
      tags: [Scheduling]
      summary: Generate deterministic auto-schedule draft
      responses: {'202': {description: Scheduler queued}}

  /schedule/reschedule:
    post:
      tags: [Scheduling]
      summary: Generate dynamic reschedule proposal
      responses: {'202': {description: Proposal generated/queued}}

  /schedule/apply:
    post:
      tags: [Scheduling]
      summary: Apply an approved schedule proposal
      responses:
        '200': {description: Applied}
        '409': {description: Version conflict}

  /notes:
    post:
      tags: [Knowledge]
      summary: Create note
      responses: {'201': {description: Created}}

  /notes/{noteId}:
    get:
      tags: [Knowledge]
      summary: Get note
      responses: {'200': {description: OK}}
    put:
      tags: [Knowledge]
      summary: Update note with optimistic version
      responses:
        '200': {description: Updated}
        '409': {description: Version conflict}

  /canvases:
    post:
      tags: [Canvas]
      summary: Create canvas
      responses: {'201': {description: Created}}

  /canvases/{canvasId}:
    get:
      tags: [Canvas]
      summary: Get canvas
      responses: {'200': {description: OK}}
    put:
      tags: [Canvas]
      summary: Save canvas scene with optimistic version
      responses:
        '200': {description: Updated}
        '409': {description: Canvas version conflict}

  /ai/proposals:
    post:
      tags: [AI]
      summary: Generate a structured AI proposal
      responses:
        '202': {description: Accepted}
        '503': {description: AI unavailable}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 255}
    RegisterResponse:
      type: object
      required: [user, token, profile]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
        profile: {$ref: '#/components/schemas/Profile'}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    LoginResponse:
      type: object
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
    Profile:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, default: en}
        timezone: {type: string, default: UTC}
        week_start_day: {type: string, enum: [monday, sunday, saturday], default: monday}
    ProfileUpdateRequest:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, maxLength: 10}
        timezone: {type: string, maxLength: 64}
        week_start_day: {type: string, enum: [monday, sunday, saturday]}
    TaskCreateRequest:
      type: object
      required: [title, priority, duration_minutes]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        priority: {type: string, enum: [low, medium, high, urgent]}
        duration_minutes: {type: integer, minimum: 1}
        goal_id: {type: string, format: uuid, nullable: true}
        milestone_id: {type: string, format: uuid, nullable: true}
        program_id: {type: string, format: uuid, nullable: true}

---

