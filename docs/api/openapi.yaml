openapi: 3.1.0
info:
  title: Kinevo API
  version: 2.0.0
  description: |
    Versioned REST API for Kinevo. Business mutations are validated server-side,
    support operation identifiers, and use stable error codes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Today
  - name: Identity
  - name: Tasks
  - name: Goals
  - name: Milestones
  - name: Programs
  - name: Activity
  - name: Notifications
  - name: Recovery
  - name: Adaptive
  - name: Focus
  - name: Progress
  - name: AI
  - name: Observability
  - name: Scheduling
  - name: Knowledge
  - name: Canvas
  - name: Offline

paths:
  /health:
    get:
      tags: [Observability]
      summary: Public readiness probe (SRS §16.3/§16.5)
      description: >-
        Used by the reverse proxy / orchestrator. Reports DB health and storage
        writability. Public; no sensitive content.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Degraded (database unhealthy)

  /metrics:
    get:
      tags: [Observability]
      summary: SRS §16.5 minimum telemetry snapshot
      description: >-
        Authenticated snapshot of DB health, queue pending/failed, storage,
        AI provider status, and recent scheduler runs. Safe metadata only —
        never sensitive content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401': { description: Unauthorized }

  /observability/runs:
    get:
      tags: [Observability]
      summary: Recent scheduler runs (SRS §7.8)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: '#/components/schemas/SchedulerRun'}
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }

  /today:
    get:
      tags: [Today]
      summary: Get canonical Today schedule (FR-01)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Today schedule view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /schedule:
    get:
      tags: [Scheduling]
      summary: Query schedule for a date or range (FR-01)
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Schedule events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /week:
    get:
      tags: [Scheduling]
      summary: Get 7-day week summary (FR-11)
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Week summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /calendar:
    get:
      tags: [Scheduling]
      summary: Get monthly calendar summary (FR-15)
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Monthly calendar summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /hard-landscape:
    get:
      tags: [Scheduling]
      summary: List Hard Landscape events for the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Scheduling]
      summary: Create a Hard Landscape event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLandscapeCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '409': { description: Overlaps an existing Hard Landscape event }
        '422': { description: Validation error }

  /hard-landscape/{eventId}:
    get:
      tags: [Scheduling]
      summary: Get a single Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }
    patch:
      tags: [Scheduling]
      summary: Update a Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLandscapeUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }
        '409': { description: Overlaps an existing Hard Landscape event }
        '422': { description: Validation error }
    delete:
      tags: [Scheduling]
      summary: Delete a Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, default: true }
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }

  /schedule-overrides:
    get:
      tags: [Scheduling]
      summary: List Schedule Overrides for the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Scheduling]
      summary: Create a Schedule Override (permanent shift or one-time exception)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '409': { description: Overlaps another override for the same source }
        '422': { description: Validation error }

  /schedule-overrides/{overrideId}:
    get:
      tags: [Scheduling]
      summary: Get a single Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }
    patch:
      tags: [Scheduling]
      summary: Update a Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }
        '409': { description: Overlaps another override for the same source }
        '422': { description: Validation error }
    delete:
      tags: [Scheduling]
      summary: Delete a Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, default: true }
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }

  /auth/register:
    post:
      tags: [Identity]
      summary: Register the first owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409': { description: Owner account already exists }
        '422': { description: Validation error }

  /auth/login:
    post:
      tags: [Identity]
      summary: Authenticate the owner and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { description: Invalid credentials }
        '422': { description: Validation error }

  /auth/me:
    get:
      tags: [Identity]
      summary: Get the authenticated owner identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401': { description: Unauthorized }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current bearer token
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /profile:
    get:
      tags: [Identity]
      summary: Get the owner profile/settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
    put:
      tags: [Identity]
      summary: Update the owner profile/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /tasks:
    post:
      tags: [Tasks]
      summary: Create or Quick Capture a task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201': { description: Created }
        '409': { description: Conflict }
        '422': { description: Business rule violation }

  /quick-capture:
    post:
      tags: [Tasks]
      summary: Quick Capture a task and attempt immediate placement (FR-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCaptureRequest'
      responses:
        '201':
          description: Placed (task + assignment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCaptureResponse'
        '200':
          description: Created but no capacity (strategies returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCaptureResponse'
        '422': { description: Validation error }

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get a single task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    put:
      tags: [Tasks]
      summary: Update editable task fields
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/status:
    post:
      tags: [Tasks]
      summary: Apply an explicit task state transition
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Invalid transition }

  /tasks/{taskId}/auto-swap:
    post:
      tags: [Tasks]
      summary: Explicit Auto Swap — move the lowest-priority unlocked task to free a slot for a new task (FR-03/FR-23/FR-28)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoSwapRequest'
      responses:
        '200':
          description: Swapped (new task placed, candidate moved to next day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSwapResponse'
        '202':
          description: Accepted but no safe candidate — new task left unplaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSwapResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/partial-complete:
    post:
      tags: [Tasks]
      summary: Partial complete — clone remaining subtasks into a continuation task (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialCompleteResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Invalid state }

  /tasks/{taskId}/subtasks:
    get:
      tags: [Tasks]
      summary: List subtasks of a task, ordered by sequence
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskListResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    post:
      tags: [Tasks]
      summary: Add a checklist subtask to a task (FR-09, no deeper hierarchy)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/subtasks/{subtaskId}:
    put:
      tags: [Tasks]
      summary: Update subtask fields (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskUpdateResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }
        '422': { description: Validation error }

  /tasks/{taskId}/subtasks/{subtaskId}/toggle:
    post:
      tags: [Tasks]
      summary: Toggle subtask complete/uncomplete and recalc task progress (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskUpdateResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }

  /subtasks/{subtaskId}/promote:
    post:
      tags: [Tasks]
      summary: Promote a subtask into a standalone task (FR-09)
      parameters:
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }

  /goals:
    get:
      tags: [Goals]
      summary: List the owner's goals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation or active-limit violation }

  /goals/{goalId}:
    get:
      tags: [Goals]
      summary: Get a single goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
    put:
      tags: [Goals]
      summary: Update editable goal fields
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/status:
    post:
      tags: [Goals]
      summary: Apply an explicit goal state transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Invalid transition }

  /goals/{goalId}/breakdown-proposals:
    post:
      tags: [Goals]
      summary: Generate a goal breakdown proposal (FR-52, FR-62)
      description: >-
        Produces a schema-validated breakdown of the goal into Milestones with
        target dates and estimated workloads, then stores it as a PENDING
        proposal. No large hierarchy is silently committed — the user must
        accept/edit/reject via the AI proposal endpoints. Invalid AI output is
        rejected (FR-61); a pending proposal is returned.
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instructions: {type: string, maxLength: 8000}
      responses:
        '200':
          description: Pending proposal generated
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: AI_OUTPUT_INVALID or invalid payload }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /goals/{goalId}/milestones:
    get:
      tags: [Milestones]
      summary: List milestones of a goal, ordered by sequence
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
    post:
      tags: [Milestones]
      summary: Create a milestone for a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/reorder:
    post:
      tags: [Milestones]
      summary: Reorder milestones of a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneReorderRequest'
      responses:
        '200': { description: Reordered }
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/{milestoneId}:
    get:
      tags: [Milestones]
      summary: Get a single milestone
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Milestone not found }
    put:
      tags: [Milestones]
      summary: Update editable milestone fields
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Milestone not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/{milestoneId}/status:
    post:
      tags: [Milestones]
      summary: Apply an explicit milestone state transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
