        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }
    post:
      tags: [Focus]
      summary: Record a completed focus session (SRS §7)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSessionCreateRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found or not owned }
        '422': { description: Invalid interval }

