      parameters:
        - name: task_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusBlockRecommendationResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }

  /progress:
    get:
      tags: [Progress]
      summary: List meaningful progress events (SRS §6.8)
      description: >-
        Append-only informational feed of meaningful progress. Events are
        generated from domain changes (task completed, milestone
        advanced/completed) or recorded manually (evidence attached,
        experiment recorded, goal progress). They never overwrite activity logs.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: event_type
          in: query
          schema:
            type: string
            enum: [task_completed, milestone_advanced, milestone_completed, evidence_attached, experiment_recorded, goal_progress]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEventListResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }
    post:
      tags: [Progress]
      summary: Record a manual progress event (SRS §6.8)
      description: >-
        Records evidence_attached / experiment_recorded / goal_progress events
        that are not derived from a status change. Informational only;
        entity references are advisory, not authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressEventCreateRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEventResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }

  /ai/status:
    get:
      tags: [AI]
      summary: AI provider status (SRS §17.8 telemetry)
      description: >-
        Safe provider metadata snapshot (provider, model, availability,
        latency, error). Never includes private content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatusResponse'
        '401': { description: Unauthorized }

  /ai/generate:
    post:
      tags: [AI]
      summary: Generate non-mutating AI text for an allowed role (SRS FR-60)
      description: >-
        Free-text generation through the configured provider (Ollama, an
        external OpenAI-compatible provider, mock, or disabled). This endpoint
        is non-mutating: AI output never reaches persistence without the
        structured-output validation and approval flow (FR-61/62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid payload }
        '503':
          description: AI provider unavailable (AI_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/proposals:
    post:
      tags: [AI]
      summary: Generate a schema-validated structured proposal (SRS FR-61, §13.3)
      description: >-
        Runs the configured provider and validates the output against the
        versioned schema for the proposal type. Malformed or invalid output is
        rejected with 422 AI_OUTPUT_INVALID and never reaches persistence as a
        domain mutation. Every run is audited in ai_runs (§7.7). The returned
        proposal awaits the user's approval decision (FR-62); nothing is
        applied here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProposalRequest'
      responses:
        '200':
          description: Validated proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProposalResponse'
        '401': { description: Unauthorized }
        '422':
          description: Invalid payload or AI_OUTPUT_INVALID
        '503':
          description: AI provider unavailable (AI_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [AI]
      summary: List the owner's AI proposals (FR-62 inbox)
      parameters:
        - name: proposal_type
          in: query
          schema:
            type: string
            enum: [goal_breakdown, milestone, task_extraction, canvas, summary]
        - name: decision
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, edited]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }

  /ai/proposals/{proposalId}:
    get:
      tags: [AI]
      summary: View one proposal (FR-62 preview)
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }

  /ai/proposals/{proposalId}/accept:
    post:
      tags: [AI]
      summary: Accept a pending proposal and apply it (FR-62)
      description: >-
        Applies the validated proposal as a domain mutation. Goal breakdown
        proposals create the referenced Goal's Milestones; task extraction
        proposals create Tasks; canvas proposals create a Canvas — each within
        a transaction. Only schema-validated proposals exist in the table, so
        accepting never persists malformed AI output (FR-61).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [milestones]
                    properties:
                      milestones:
                        type: array
                        items: {$ref: '#/components/schemas/Milestone'}
                  - type: object
                    required: [tasks]
                    properties:
                      tasks:
                        type: array
                        items: {$ref: '#/components/schemas/Task'}
                  - type: object
                    required: [canvas]
                    properties:
                      canvas: {$ref: '#/components/schemas/Canvas'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }
        '422': { description: Not pending or unsupported type }

  /ai/proposals/{proposalId}/reject:
    post:
      tags: [AI]
      summary: Reject a pending proposal (FR-62)
      description: Rejection creates no domain mutation (FR-62 acceptance criterion).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Proposal not found }
        '422': { description: Not pending }

  /ai/summarize-note:
    post:
      tags: [AI]
      summary: Generate a note summarization proposal (SRS §13.3)
      description: >-
        Sends only the owner's note plain-text content (context-budgeted,
        SRS §13.4), validates the AI output against the summary schema (FR-61),
        and stores it as a PENDING proposal. Informational; no mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note_id]
              properties:
                note_id: {type: integer}
                instructions: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Note not found }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/extract-tasks:
    post:
      tags: [AI]
      summary: Generate a task extraction proposal from a note (SRS §13.3, §17.4 #5)
      description: >-
        Sends only the owner's note plain-text content (context-budgeted,
        SRS §13.4), validates the AI output against the task extraction schema
        (FR-61), and stores it as a PENDING proposal. Tasks are created only
        after the user accepts (FR-62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note_id]
              properties:
                note_id: {type: integer}
                instructions: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '404': { description: Note not found }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/suggest-canvas:
    post:
      tags: [AI]
      summary: Generate a canvas generation proposal (SRS §13.3 CanvasProposal)
      description: >-
        Generates a proposed canvas title and sections from the user prompt,
        validates the output against the canvas schema (FR-61), and stores it
        as a PENDING proposal. The Canvas is created only after the user
        accepts (FR-62); Excalidraw scene serialization stays an editor concern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, maxLength: 8000}
                system_prompt: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Pending proposal
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: {$ref: '#/components/schemas/AiProposal'}
        '401': { description: Unauthorized }
        '422': { description: AI_OUTPUT_INVALID }
        '503': { description: AI_PROVIDER_UNAVAILABLE }

  /ai/runs:
    get:
      tags: [AI]
      summary: List the owner's AI run audit records (SRS §7.7)
      parameters:
        - name: proposal_type
          in: query
          schema:
            type: string
            enum: [goal_breakdown, milestone, task_extraction, canvas, summary]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunsResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 255}
    RegisterResponse:
      type: object
      required: [user, token, profile]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
        profile: {$ref: '#/components/schemas/Profile'}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    LoginResponse:
      type: object
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
    Profile:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, default: en}
        timezone: {type: string, default: UTC}
        week_start_day: {type: string, enum: [monday, sunday, saturday], default: monday}
    ProfileUpdateRequest:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, maxLength: 10}
        timezone: {type: string, maxLength: 64}
        week_start_day: {type: string, enum: [monday, sunday, saturday]}
    TaskCreateRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3, default: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
    TaskUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
    TaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [backlog, scheduled, in_progress, partial, continued, completed, skipped, missed, conflict]}
    Task:
      type: object
      required: [id, title, status, priority_tier, version]
      properties:
        id: {type: integer}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        milestone_id: {type: integer, nullable: true}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        status: {type: string, enum: [backlog, scheduled, in_progress, partial, continued, completed, skipped, missed, conflict]}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
        progress_mode: {type: string, enum: [derived, manual], default: derived}
        progress: {type: integer, minimum: 0, maximum: 100, default: 0}
        version: {type: integer}
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: {$ref: '#/components/schemas/Task'}
    QuickCaptureRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        size: {type: string, enum: [cepat, sedang, berat]}
        duration_minutes: {type: integer, minimum: 1, nullable: true}
        program_id: {type: integer, nullable: true}
        goal_id: {type: integer, nullable: true}
        date: {type: string, format: date, nullable: true}
    QuickCaptureResponse:
      type: object
      required: [task, placed, code, strategies]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        placed: {type: boolean}
        assignment: {$ref: '#/components/schemas/ScheduleAssignment', nullable: true}
        code: {type: string, enum: [PLACED, TASK_NO_CAPACITY]}
        strategies:
          type: array
          items: {type: string, enum: [manual_swap, auto_swap, schedule_later]}
    AutoSwapRequest:
      type: object
      required: [date, duration_minutes]
      properties:
        date: {type: string, format: date}
        duration_minutes: {type: integer, minimum: 1}
    AutoSwapResponse:
