openapi: 3.1.0
info:
  title: Kinevo API
  version: 2.0.0
  description: |
    Versioned REST API for Kinevo. Business mutations are validated server-side,
    support operation identifiers, and use stable error codes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Today
  - name: Identity
  - name: Tasks
  - name: Goals
  - name: Milestones
  - name: Programs
  - name: Activity
  - name: Notifications
  - name: Recovery
  - name: Adaptive
  - name: Focus
  - name: Execution
  - name: Recharge
  - name: Progress
  - name: AI
  - name: Observability
  - name: Scheduling
  - name: Knowledge
  - name: Canvas
  - name: Offline

paths:
  /health:
    get:
      tags: [Observability]
      summary: Public readiness probe (SRS §16.3/§16.5)
      description: >-
        Used by the reverse proxy / orchestrator. Reports DB health and storage
        writability. Public; no sensitive content.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Degraded (database unhealthy)

  /metrics:
    get:
      tags: [Observability]
      summary: SRS §16.5 minimum telemetry snapshot
      description: >-
        Authenticated snapshot of DB health, queue pending/failed, storage,
        AI provider status, and recent scheduler runs. Safe metadata only —
        never sensitive content.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401': { description: Unauthorized }

  /observability/runs:
    get:
      tags: [Observability]
      summary: Recent scheduler runs (SRS §7.8)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: '#/components/schemas/SchedulerRun'}
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }

  /today:
    get:
      tags: [Today]
      summary: Get canonical Today schedule (FR-01)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Today schedule view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /schedule:
    get:
      tags: [Scheduling]
      summary: Query schedule for a date or range (FR-01)
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Schedule events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /week:
    get:
      tags: [Scheduling]
      summary: Get 7-day week summary (FR-11)
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Week summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /calendar:
    get:
      tags: [Scheduling]
      summary: Get monthly calendar summary (FR-15)
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Monthly calendar summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /hard-landscape:
    get:
      tags: [Scheduling]
      summary: List Hard Landscape events for the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Scheduling]
      summary: Create a Hard Landscape event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLandscapeCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '409': { description: Overlaps an existing Hard Landscape event }
        '422': { description: Validation error }

  /hard-landscape/{eventId}:
    get:
      tags: [Scheduling]
      summary: Get a single Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }
    patch:
      tags: [Scheduling]
      summary: Update a Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLandscapeUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLandscapeResponse'
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }
        '409': { description: Overlaps an existing Hard Landscape event }
        '422': { description: Validation error }
    delete:
      tags: [Scheduling]
      summary: Delete a Hard Landscape event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, default: true }
        '401': { description: Unauthorized }
        '404': { description: Hard Landscape event not found }

  /schedule-overrides:
    get:
      tags: [Scheduling]
      summary: List Schedule Overrides for the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Scheduling]
      summary: Create a Schedule Override (permanent shift or one-time exception)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '409': { description: Overlaps another override for the same source }
        '422': { description: Validation error }

  /schedule-overrides/{overrideId}:
    get:
      tags: [Scheduling]
      summary: Get a single Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }
    patch:
      tags: [Scheduling]
      summary: Update a Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverrideUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideResponse'
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }
        '409': { description: Overlaps another override for the same source }
        '422': { description: Validation error }
    delete:
      tags: [Scheduling]
      summary: Delete a Schedule Override
      parameters:
        - name: overrideId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, default: true }
        '401': { description: Unauthorized }
        '404': { description: Schedule override not found }

  /auth/register:
    post:
      tags: [Identity]
      summary: Register the first owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409': { description: Owner account already exists }
        '422': { description: Validation error }

  /auth/login:
    post:
      tags: [Identity]
      summary: Authenticate the owner and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { description: Invalid credentials }
        '422': { description: Validation error }

  /auth/me:
    get:
      tags: [Identity]
      summary: Get the authenticated owner identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401': { description: Unauthorized }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current bearer token
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /profile:
    get:
      tags: [Identity]
      summary: Get the owner profile/settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
    put:
      tags: [Identity]
      summary: Update the owner profile/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /tasks:
    post:
      tags: [Tasks]
      summary: Create or Quick Capture a task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201': { description: Created }
        '409': { description: Conflict }
        '422': { description: Business rule violation }

  /quick-capture:
    post:
      tags: [Tasks]
      summary: Quick Capture a task and attempt immediate placement (FR-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCaptureRequest'
      responses:
        '201':
          description: Placed (task + assignment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCaptureResponse'
        '200':
          description: Created but no capacity (strategies returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCaptureResponse'
        '422': { description: Validation error }

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get a single task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    put:
      tags: [Tasks]
      summary: Update editable task fields
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/status:
    post:
      tags: [Tasks]
      summary: Apply an explicit task state transition
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Invalid transition }

  /tasks/{taskId}/auto-swap:
    post:
      tags: [Tasks]
      summary: Explicit Auto Swap — move the lowest-priority unlocked task to free a slot for a new task (FR-03/FR-23/FR-28)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoSwapRequest'
      responses:
        '200':
          description: Swapped (new task placed, candidate moved to next day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSwapResponse'
        '202':
          description: Accepted but no safe candidate — new task left unplaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSwapResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/partial-complete:
    post:
      tags: [Tasks]
      summary: Partial complete — clone remaining subtasks into a continuation task (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialCompleteResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Invalid state }

  /tasks/{taskId}/subtasks:
    get:
      tags: [Tasks]
      summary: List subtasks of a task, ordered by sequence
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskListResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    post:
      tags: [Tasks]
      summary: Add a checklist subtask to a task (FR-09, no deeper hierarchy)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found }
        '422': { description: Validation error }

  /tasks/{taskId}/subtasks/{subtaskId}:
    put:
      tags: [Tasks]
      summary: Update subtask fields (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtaskUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskUpdateResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }
        '422': { description: Validation error }

  /tasks/{taskId}/subtasks/{subtaskId}/toggle:
    post:
      tags: [Tasks]
      summary: Toggle subtask complete/uncomplete and recalc task progress (FR-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtaskUpdateResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }

  /subtasks/{subtaskId}/promote:
    post:
      tags: [Tasks]
      summary: Promote a subtask into a standalone task (FR-09)
      parameters:
        - name: subtaskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteResponse'
        '401': { description: Unauthorized }
        '404': { description: Subtask not found }

  /attachments/rules:
    get:
      tags: [Tasks]
      summary: Attachment limits (FR-43)
      description: Exposes the evidence-attachment limits so the client can pre-validate (max 3 per completed task, ≤5 MB, JPG/PNG/PDF).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attachment limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentRulesResponse'
        '401': { description: Unauthorized }
  /tasks/{taskId}/attachments:
    get:
      tags: [Tasks]
      summary: List a task's evidence attachments (FR-43)
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Attachment list
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items: {$ref: '#/components/schemas/Attachment'}
        '401': { description: Unauthorized }
        '404': { description: Task not found }
    post:
      tags: [Tasks]
      summary: Upload an evidence attachment to a completed task (FR-43)
      description: >
        Attaches a file (JPG/PNG/PDF, ≤5 MB) to a completed task, max 3 per
        task. The content type is detected from the file contents, never trusted
        from the browser alone (SRS line 1641). Files are stored privately and
        are not world-readable.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: {$ref: '#/components/schemas/Attachment'}
        '401': { description: Unauthorized }
        '422': { description: Validation error (not completed, limit reached, type/size) }
  /tasks/{taskId}/attachments/{attachmentId}:
    get:
      tags: [Tasks]
      summary: Download an evidence attachment (FR-43)
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Unauthorized }
        '404': { description: Attachment not found }
    delete:
      tags: [Tasks]
      summary: Delete an evidence attachment (FR-43)
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '401': { description: Unauthorized }
        '404': { description: Attachment not found }

  /imports/krs-pdf:
    post:
      tags: [Imports]
      summary: Upload and stage a KRS PDF import (FR-24)
      description: >
        Accepts a KRS PDF (≤5 MB), parses the schedule into candidate rows, and
        stores them in a pending staging state. Nothing is persisted to the
        schedule until the user confirms the preview.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Staged import (preview)
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: {$ref: '#/components/schemas/KrsImport'}
        '401': { description: Unauthorized }
        '422': { description: Validation error (not PDF, oversized, unparseable) }
  /imports/{importId}:
    get:
      tags: [Imports]
      summary: Fetch a staged KRS import for preview (FR-24)
      security:
        - bearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Staged import
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: {$ref: '#/components/schemas/KrsImport'}
        '401': { description: Unauthorized }
        '404': { description: Import not found }
  /imports/{importId}/confirm:
    post:
      tags: [Imports]
      summary: Confirm and persist a staged KRS import (FR-24)
      description: >
        Persists each parsed row as a weekly recurring Hard Landscape event in a
        single transaction and marks the import confirmed. Never silently
        overwrites an existing schedule.
      security:
        - bearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Import confirmed
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: {$ref: '#/components/schemas/KrsImport'}
        '401': { description: Unauthorized }
        '422': { description: Not found or already resolved }
  /imports/{importId}/discard:
    post:
      tags: [Imports]
      summary: Discard a staged KRS import (FR-24)
      security:
        - bearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Import discarded
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import: {$ref: '#/components/schemas/KrsImport'}
        '401': { description: Unauthorized }
        '422': { description: Not found or already resolved }
  /imports/ics:
    post:
      tags: [Imports]
      summary: Upload and stage an iCalendar (.ics) import (FR-30)
      description: >
        Accepts an .ics/.ical calendar (≤5 MB), parses VEVENTs into candidate
        Hard Landscape rows in the owner's profile timezone, flags conflicts
        against the existing schedule, and stores the result in a pending
        staging state. Malformed events are reported per-event (never silently
        dropped) and nothing is persisted until the user confirms the preview.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
