openapi: 3.1.0
info:
  title: LIFESYNC OS API
  version: 2.0.0
  description: |
    Versioned REST API for LIFESYNC OS. Business mutations are validated server-side,
    support operation identifiers, and use stable error codes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Today
  - name: Identity
  - name: Tasks
  - name: Goals
  - name: Milestones
  - name: Programs
  - name: Scheduling
  - name: Knowledge
  - name: Canvas
  - name: AI
  - name: Offline

paths:
  /today:
    get:
      tags: [Today]
      summary: Get canonical Today schedule
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /auth/register:
    post:
      tags: [Identity]
      summary: Register the first owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409': { description: Owner account already exists }
        '422': { description: Validation error }

  /auth/login:
    post:
      tags: [Identity]
      summary: Authenticate the owner and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { description: Invalid credentials }
        '422': { description: Validation error }

  /auth/me:
    get:
      tags: [Identity]
      summary: Get the authenticated owner identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401': { description: Unauthorized }

  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current bearer token
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /profile:
    get:
      tags: [Identity]
      summary: Get the owner profile/settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
    put:
      tags: [Identity]
      summary: Update the owner profile/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /tasks:
    post:
      tags: [Tasks]
      summary: Create or Quick Capture a task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201': { description: Created }
        '409': { description: Conflict }
        '422': { description: Business rule violation }

  /goals:
    get:
      tags: [Goals]
      summary: List the owner's goals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation or active-limit violation }

  /goals/{goalId}:
    get:
      tags: [Goals]
      summary: Get a single goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
    put:
      tags: [Goals]
      summary: Update editable goal fields
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/status:
    post:
      tags: [Goals]
      summary: Apply an explicit goal state transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Invalid transition }

  /goals/{goalId}/breakdown-proposals:
    post:
      tags: [Goals]
      summary: Generate milestone/work breakdown proposal
      responses: {'202': {description: Proposal generation accepted}}

  /goals/{goalId}/milestones:
    get:
      tags: [Milestones]
      summary: List milestones of a goal, ordered by sequence
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
    post:
      tags: [Milestones]
      summary: Create a milestone for a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/reorder:
    post:
      tags: [Milestones]
      summary: Reorder milestones of a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneReorderRequest'
      responses:
        '200': { description: Reordered }
        '401': { description: Unauthorized }
        '404': { description: Goal not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/{milestoneId}:
    get:
      tags: [Milestones]
      summary: Get a single milestone
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Milestone not found }
    put:
      tags: [Milestones]
      summary: Update editable milestone fields
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Milestone not found }
        '422': { description: Validation error }

  /goals/{goalId}/milestones/{milestoneId}/status:
    post:
      tags: [Milestones]
      summary: Apply an explicit milestone state transition
      parameters:
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '401': { description: Unauthorized }
        '404': { description: Milestone not found }
        '422': { description: Invalid transition }

  /programs:
    get:
      tags: [Programs]
      summary: List programs of the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Programs]
      summary: Create a program (FR-26 workload types)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /programs/{programId}:
    get:
      tags: [Programs]
      summary: Get a single program
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401': { description: Unauthorized }
        '404': { description: Program not found }
    put:
      tags: [Programs]
      summary: Update editable program fields
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401': { description: Unauthorized }
        '404': { description: Program not found }
        '422': { description: Validation error }

  /programs/{programId}/status:
    post:
      tags: [Programs]
      summary: Apply an explicit FR-22 lifecycle transition
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401': { description: Unauthorized }
        '404': { description: Program not found }
        '422': { description: Invalid transition }

  /schedule/auto:
    post:
      tags: [Scheduling]
      summary: Generate deterministic auto-schedule draft
      responses: {'202': {description: Scheduler queued}}

  /schedule/reschedule:
    post:
      tags: [Scheduling]
      summary: Generate dynamic reschedule proposal
      responses: {'202': {description: Proposal generated/queued}}

  /schedule/apply:
    post:
      tags: [Scheduling]
      summary: Apply an approved schedule proposal
      responses:
        '200': {description: Applied}
        '409': {description: Version conflict}

  /notes:
    post:
      tags: [Knowledge]
      summary: Create note
      responses: {'201': {description: Created}}

  /notes/{noteId}:
    get:
      tags: [Knowledge]
      summary: Get note
      responses: {'200': {description: OK}}
    put:
      tags: [Knowledge]
      summary: Update note with optimistic version
      responses:
        '200': {description: Updated}
        '409': {description: Version conflict}

  /canvases:
    post:
      tags: [Canvas]
      summary: Create canvas
      responses: {'201': {description: Created}}

  /canvases/{canvasId}:
    get:
      tags: [Canvas]
      summary: Get canvas
      responses: {'200': {description: OK}}
    put:
      tags: [Canvas]
      summary: Save canvas scene with optimistic version
      responses:
        '200': {description: Updated}
        '409': {description: Canvas version conflict}

  /ai/proposals:
    post:
      tags: [AI]
      summary: Generate a structured AI proposal
      responses:
        '202': {description: Accepted}
        '503': {description: AI unavailable}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 255}
    RegisterResponse:
      type: object
      required: [user, token, profile]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
        profile: {$ref: '#/components/schemas/Profile'}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    LoginResponse:
      type: object
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        token: {type: string}
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
    Profile:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, default: en}
        timezone: {type: string, default: UTC}
        week_start_day: {type: string, enum: [monday, sunday, saturday], default: monday}
    ProfileUpdateRequest:
      type: object
      properties:
        display_name: {type: string, nullable: true, maxLength: 255}
        locale: {type: string, maxLength: 10}
        timezone: {type: string, maxLength: 64}
        week_start_day: {type: string, enum: [monday, sunday, saturday]}
    TaskCreateRequest:
      type: object
      required: [title, priority, duration_minutes]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        priority: {type: string, enum: [low, medium, high, urgent]}
        duration_minutes: {type: integer, minimum: 1}
        goal_id: {type: string, format: uuid, nullable: true}
        milestone_id: {type: string, format: uuid, nullable: true}
        program_id: {type: string, format: uuid, nullable: true}
    Goal:
      type: object
      required: [id, title, horizon, status, priority_tier]
      properties:
        id: {type: integer}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        horizon: {type: string, enum: [yearly, quarterly, monthly, custom]}
        start_date: {type: string, format: date, nullable: true}
        target_date: {type: string, format: date, nullable: true}
        target_metric: {type: string, nullable: true, maxLength: 100}
        status: {type: string, enum: [draft, active, paused, completed, archived, dropped]}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
        progress_mode: {type: string, enum: [derived, manual], default: derived}
        progress: {type: integer, minimum: 0, maximum: 100, default: 0}
    GoalCreateRequest:
      type: object
      required: [title, horizon]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        horizon: {type: string, enum: [yearly, quarterly, monthly, custom]}
        start_date: {type: string, format: date, nullable: true}
        target_date: {type: string, format: date, nullable: true}
        target_metric: {type: string, nullable: true, maxLength: 100}
        priority_tier: {type: integer, minimum: 1, maximum: 3, default: 3}
    GoalUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        horizon: {type: string, enum: [yearly, quarterly, monthly, custom]}
        start_date: {type: string, format: date, nullable: true}
        target_date: {type: string, format: date, nullable: true}
        target_metric: {type: string, nullable: true, maxLength: 100}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
    GoalStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [draft, active, paused, completed, archived, dropped]}
    GoalResponse:
      type: object
      required: [goal]
      properties:
        goal: {$ref: '#/components/schemas/Goal'}
    GoalListResponse:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items: {$ref: '#/components/schemas/Goal'}
    Milestone:
      type: object
      required: [id, goal_id, title, sequence, status, version]
      properties:
        id: {type: integer}
        goal_id: {type: integer}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        sequence: {type: integer, minimum: 0}
        target_date: {type: string, format: date, nullable: true}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
        status: {type: string, enum: [planned, active, blocked, completed, dropped]}
        progress_mode: {type: string, enum: [derived, manual], default: derived}
        progress: {type: integer, minimum: 0, maximum: 100, default: 0}
        completed_at: {type: string, format: date-time, nullable: true}
        version: {type: integer}
    MilestoneCreateRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        sequence: {type: integer, minimum: 0}
        target_date: {type: string, format: date, nullable: true}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
    MilestoneUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        sequence: {type: integer, minimum: 0}
        target_date: {type: string, format: date, nullable: true}
        estimated_minutes: {type: integer, minimum: 1, nullable: true}
    MilestoneStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [planned, active, blocked, completed, dropped]}
    MilestoneReorderRequest:
      type: object
      required: [ordered_ids]
      properties:
        ordered_ids:
          type: array
          items: {type: integer}
    MilestoneResponse:
      type: object
      required: [milestone]
      properties:
        milestone: {$ref: '#/components/schemas/Milestone'}
    MilestoneListResponse:
      type: object
      required: [milestones]
      properties:
        milestones:
          type: array
          items: {$ref: '#/components/schemas/Milestone'}
    Program:
      type: object
      required: [id, name, workload_type, status, version]
      properties:
        id: {type: integer}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        category: {type: string, maxLength: 100, nullable: true}
        workload_type: {type: string, enum: [structured, range, flexible]}
        weekly_target_minutes: {type: integer, minimum: 1, nullable: true}
        min_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        max_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        status: {type: string, enum: [active, paused, completed, dropped]}
        priority_tier: {type: integer, minimum: 1, maximum: 3, default: 3}
        version: {type: integer}
    ProgramCreateRequest:
      type: object
      required: [name, workload_type]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        category: {type: string, maxLength: 100, nullable: true}
        workload_type: {type: string, enum: [structured, range, flexible]}
        weekly_target_minutes: {type: integer, minimum: 1, nullable: true}
        min_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        max_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3, default: 3}
    ProgramUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, nullable: true}
        category: {type: string, maxLength: 100, nullable: true}
        workload_type: {type: string, enum: [structured, range, flexible]}
        weekly_target_minutes: {type: integer, minimum: 1, nullable: true}
        min_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        max_weekly_minutes: {type: integer, minimum: 0, nullable: true}
        priority_tier: {type: integer, minimum: 1, maximum: 3}
    ProgramStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [active, paused, completed, dropped]}
    ProgramResponse:
      type: object
      required: [program]
      properties:
        program: {$ref: '#/components/schemas/Program'}
    ProgramListResponse:
      type: object
      required: [programs]
      properties:
        programs:
          type: array
          items: {$ref: '#/components/schemas/Program'}

---

