        '422': { description: Validation error }

  /schedule/mini-pause:
    post:
      tags: [Scheduling]
      summary: Mini Pause — move all eligible today tasks to the next day (FR-07)
      description: >
        Moves every unlocked, non-terminal task scheduled on `date` to the
        first feasible slot on the following day, preserving hard constraints.
        Locked assignments are never auto-moved; tasks with no feasible next-day
        slot stay in place and are reported as visible conflicts. The change is
        persisted atomically at the next schedule version, logged, and explained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniPauseRequest'
      responses:
        '200':
          description: Tasks moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniPauseResponse'
        '202':
          description: Accepted — nothing eligible to move
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniPauseResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /schedule/export/ics:
    get:
      tags: [Scheduling]
      summary: Export selected schedule range as iCalendar (.ics) (FR-30 / TASK-143)
      description: >
        Downloads the owner's schedule for the selected `from`/`to` date range
        as a valid RFC-5545 iCalendar (.ics) document. Schedule assignments and
        one-time / permanent Hard Landscape events become VEVENTs; recurring
        Hard Landscape events are expanded within the selected window. Internal
        database identifiers are not exposed (content-derived UIDs), and only
        exportable fields are written (NFR-03).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD).
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Inclusive end date (YYYY-MM-DD), on or after `from`.
      responses:
        '200':
          description: Valid iCalendar document
          content:
            text/calendar:
              schema: { type: string }
        '401': { description: Unauthorized }
        '422': { description: Validation error (missing/invalid from/to) }

  /schedule/emergency-pause:
    post:
      tags: [Scheduling]
      summary: Emergency Pause — tag the week exceptional and shift eligible tasks +1 week (FR-07)
      description: >
        Marks the week containing `date` as an exceptional recovery period,
        keeps the `keep_task_ids` tasks in place, and moves every other
        unlocked, non-terminal task scheduled this week to the first feasible
        slot on the same weekday next week, preserving hard constraints. Locked
        assignments are never auto-moved; tasks with no feasible next-week slot
        stay in place and are reported as visible conflicts. Task ownership is
        preserved and no task is deleted. The week is tagged via a pause event
        (drives recovery-state UI and notification suppression) and the change
        is persisted atomically at the next schedule version, logged, and
        explained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyPauseRequest'
      responses:
        '200':
          description: Week tagged; tasks moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyPauseResponse'
        '202':
          description: Accepted — no eligible tasks to move (week not tagged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyPauseResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }

  /break:
    post:
      tags: [Scheduling]
      summary: Start Break Mode — confirm a manual break period (FR-36)
      description: >
        Confirms a Break Mode (holiday) period from `start_date` to `end_date`.
        The covered weeks are tagged exceptional so the capacity feedback loop
        excludes them (FR-49), EOD reconciliation prompts are suppressed while
        the break is active (FR-47 Business Rules), and the start is recorded as
        a `break_start` activity event. One active break at a time; an existing
        active break must be ended first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBreakRequest'
      responses:
        '200':
          description: Break Mode confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartBreakResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }
  /break/end:
    post:
      tags: [Scheduling]
      summary: End Break Mode — end the active break and return its summary (FR-36/FR-39)
      description: >
        Ends the user's active Break Mode period and returns the break summary
        (start/end dates and duration) for the in-app report. The covered weeks
        are no longer tagged exceptional. Recorded as a `break_end` activity
        event.
      responses:
        '200':
          description: Break ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndBreakResponse'
        '202':
          description: Accepted — no active break to end
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndBreakResponse'
        '401': { description: Unauthorized }

  /boost:
    get:
      tags: [Scheduling]
      summary: Boost Mode setup — current target and recommendation (FR-37)
      description: >
        Shows the Boost Mode setup: whether it is eligible (Break Mode must be
        confirmed), the currently active boost target, and a recommendation
        computed by reusing the Capacity feedback loop (FR-49). A recent average
        realization above 90% with no burnout signal offers Boost Mode; the
        suggested target is capped at the 70% safety limit. With an active
        burnout signal the recommendation is suppressed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Boost setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostSetupResponse'
        '401': { description: Unauthorized }
    post:
      tags: [Scheduling]
      summary: Save a boost target for the active break (FR-37/FR-38)
      description: >
        Confirms and saves a holiday boost target with a validity period scoped
        by start/end datetime (defaulting to the active break period). The target
        is the percentage of daily capacity the schedule may use during Break
        Mode. A proposed target above the 70% safety cap is capped with an
        explicit warning. Saving ends any previous active boost target. Recorded
        as a `boost_start` activity event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBoostTargetRequest'
      responses:
        '200':
          description: Boost target saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBoostTargetResponse'
        '401': { description: Unauthorized }
        '422': { description: Validation error }
  /boost/end:
    post:
      tags: [Scheduling]
      summary: End the active boost target (FR-38 Alternative Flow)
      description: >
        Ends the active boost target early; the scheduler returns to the baseline
        target. Recorded as a `boost_end` activity event.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Boost target ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndBoostTargetResponse'
        '202':
          description: Accepted — no active boost target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndBoostTargetResponse'
  /analytics/work-life:
    get:
      tags: [Analytics]
      summary: Work-Life Ratio analytics (FR-05, TASK-126)
      description: >
        Aggregates the user's already-recorded productive (focus) and Recharge
        minutes over a period and derives the normative WorkRatio/RechargeRatio.
        The ratio describes how tracked time is distributed between focus and
        recharge — a time-balance indicator, never a health diagnosis. `from`
        defaults to the start of the week containing `to`; `to` defaults to now.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Period start date (Y-m-d). Defaults to the start of the week of `to`.
          schema: { type: string, format: date, example: '2026-08-18' }
        - name: to
          in: query
          required: false
          description: Period end date (Y-m-d). Defaults to now.
          schema: { type: string, format: date, example: '2026-08-20' }
      responses:
        '200':
          description: Work-Life Ratio analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLifeAnalyticsResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid from/to or inverted range }
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Analytics overview — all read models for the period (TASK-130)
      description: >
        Composes every analytics read model for the period in one response:
        task completion, goal progress, capacity (reusing the FR-49 feedback
        loop), activity, focus, progress events, and the Work-Life Ratio. Read
        models are served from the backend so Vue never recomputes business
        numbers.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Period start date (Y-m-d). Defaults to the start of the week of `to`.
          schema: { type: string, format: date, example: '2026-08-18' }
        - name: to
          in: query
          required: false
          description: Period end date (Y-m-d). Defaults to now.
          schema: { type: string, format: date, example: '2026-08-20' }
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid from/to or inverted range }
  /analytics/pillars:
    get:
      tags: [Analytics]
      summary: Four-pillar realization vs target (FR-12, TASK-133)
      description: >
        Aggregates completed task minutes per life pillar (Karier, Kesehatan,
        Bahasa, Branding) plus Uncategorized and compares them against the mapped
        program weekly targets. Pillars are determined through program category
        mapping; tasks without a mapping fall back to Uncategorized. A missing
        target yields N/A (null), never NaN.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Period start date (Y-m-d). Defaults to the start of the week of `to`.
          schema: { type: string, format: date, example: '2026-08-18' }
        - name: to
          in: query
          required: false
          description: Period end date (Y-m-d). Defaults to now.
          schema: { type: string, format: date, example: '2026-08-20' }
      responses:
        '200':
          description: Pillar realization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PillarAnalyticsResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid from/to or inverted range }
  /analytics/heatmap:
    get:
      tags: [Analytics]
      summary: Annual activity heatmap (FR-31, TASK-134)
      description: >
        Per-day activity intensity derived from completion and recharge (plus
        productive time and progress events), with an optional pillar filter
        (FR-31). The metric definition is fixed and stable within a report
        version; each day carries exact values for accessible alternatives and
        missing dates report zero with a readable label. `from` defaults to the
        trailing year of `to`.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Period start date (Y-m-d). Defaults to 364 days before `to`.
          schema: { type: string, format: date, example: '2025-08-20' }
        - name: to
          in: query
          required: false
          description: Period end date (Y-m-d). Defaults to now.
          schema: { type: string, format: date, example: '2026-08-20' }
        - name: pillar
          in: query
          required: false
          description: Filter the completion/progress dataset to one pillar. Omit for all pillars.
          schema: { type: string, enum: [karier, kesehatan, bahasa, branding, uncategorized] }
      responses:
        '200':
          description: Heatmap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapAnalyticsResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid from/to or inverted range }

