    post:
      tags: [Execution]
      summary: Abandon an active execution timer (TASK-120)
      description: >-
        Ends the timer without recording a focus session. Appends a
        task_abandoned activity event; the task stays in its current state.
      responses:
        '200':
          description: Abandoned
          content:
            application/json:
              schema:
