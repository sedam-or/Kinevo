  /recovery:
    get:
      tags: [Recovery]
      summary: Morning Recovery list — previous-day Terlewat tasks (FR-48)
      description: >-
        Terlewat (missed) tasks ordered by nearest deadline first. Tasks whose
        program is Completed/Dropped are flagged via `invalid_reason` and
        reschedule is withheld (FR-48 Exception Flow).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryListResponse'
        '401': { description: Unauthorized }

  /recovery/{taskId}:
    post:
      tags: [Recovery]
      summary: Resolve a recovered task (FR-48)
      description: >-
        Applies an explicit action to a Terlewat task: `reschedule` (to
        scheduled, optionally with a new `due_at`), `complete`, or `backlog`.
        Only missed tasks are recoverable; invalid actions are rejected (422).
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryResolveRequest'
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found or not owned }
        '422': { description: Invalid action, not a missed task, or action not available }

  /adaptive/context:
    get:
      tags: [Adaptive]
      summary: List recent context check-ins (FR-58)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextObservationListResponse'
        '401': { description: Unauthorized }
        '422': { description: Invalid query parameters }
    post:
      tags: [Adaptive]
      summary: Record a context check-in (FR-58)
      description: >-
        Records user-entered adaptive signals (energy, stress, task difficulty,
        skill familiarity, interruptions, context-switch cost, focus duration).
        At least one signal is required. Signals are subjective and advisory —
        never clinical or neurological measurements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextCheckInRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextObservationResponse'
        '401': { description: Unauthorized }
        '404': { description: Task not found or not owned }
        '422': { description: Invalid or missing signals }

  /adaptive/burnout:
    get:
      tags: [Adaptive]
      summary: Evaluate the burnout warning heuristic (FR-49 upstream, TASK-060)
      description: >-
        Sustained high stress with low energy over recent check-ins raises a
        warning that suppresses aggressive capacity boosts. Advisory only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BurnoutSignalResponse'
        '401': { description: Unauthorized }

