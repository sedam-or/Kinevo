      tags: [Execution]
      summary: Pause a running execution timer (TASK-120)
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSessionResponse'
        '401': { description: Unauthorized }
        '404': { description: Execution session not found }
        '422': { description: Session is not running }

