<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Kinevo — Plan. Schedule. Focus. Adapt.">
  <title>Kinevo</title>
  <defs>
    <pattern id="dots-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1B1B18" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="320" fill="#FDFDFC"/>
  <rect width="1280" height="320" fill="url(#dots-l)"/>

  <!-- hairline frame + corner ticks (construction detail) -->
  <rect x="12" y="12" width="1256" height="296" fill="none" stroke="#1B1B18" stroke-opacity="0.08"/>
  <g stroke="#1B1B18" stroke-opacity="0.28" stroke-width="1.5">
    <path d="M12 26 v-14 h14" fill="none"/>
    <path d="M1254 12 h14 v14" fill="none"/>
    <path d="M1268 294 v14 h-14" fill="none"/>
    <path d="M26 308 h-14 v-14" fill="none"/>
  </g>

  <!-- top micro label -->
  <text x="88" y="54" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="3" fill="#6F6F68">PERSONAL OPERATING SYSTEM</text>

  <!-- mark: K built from stem + rising milestone steps + forward leg -->
  <g transform="translate(88,80)">
    <rect width="160" height="160" rx="28" fill="#F53003"/>
    <rect x="42" y="38" width="17" height="84" rx="3" fill="#FFFFFF"/>
    <path d="M74 88 h22 v-20 h24 v-20" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M72 92 L112 124" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="square"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="296" y="170" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1B1B18">Kinevo</text>
  <text x="299" y="214" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#6F6F68">Plan. Schedule. Focus. Adapt.</text>

  <!-- the product argument: one deterministic chain -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2">
    <g fill="#1B1B18">
      <rect x="298" y="242" width="52" height="25" rx="5" fill="none" stroke="#1B1B18" stroke-opacity="0.22"/>
      <text x="311" y="259">GOAL</text>
      <rect x="374" y="242" width="104" height="25" rx="5" fill="none" stroke="#1B1B18" stroke-opacity="0.22"/>
      <text x="387" y="259">BREAKDOWN</text>
      <rect x="502" y="242" width="84" height="25" rx="5" fill="none" stroke="#1B1B18" stroke-opacity="0.22"/>
      <text x="503" y="259">SCHEDULE</text>
      <rect x="610" y="242" width="62" height="25" rx="5" fill="none" stroke="#1B1B18" stroke-opacity="0.22"/>
      <text x="611" y="259">TODAY</text>
      <rect x="696" y="242" width="62" height="25" rx="5" fill="none" stroke="#1B1B18" stroke-opacity="0.22"/>
      <text x="697" y="259">ADAPT</text>
    </g>
    <g fill="#F53003" font-size="14">
      <text x="357" y="260">&#8594;</text>
      <text x="473" y="260">&#8594;</text>
      <text x="581" y="260">&#8594;</text>
      <text x="667" y="260">&#8594;</text>
    </g>
  </g>

  <!-- bottom-right micro label -->
  <text x="1192" y="296" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.5" fill="#6F6F68">SELF-HOSTED &#183; OFFLINE-FIRST &#183; LOCAL AI &#183; MIT</text>
</svg>
