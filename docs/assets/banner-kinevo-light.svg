<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Kinevo. Plan. Schedule. Focus. Adapt.">
  <title>Kinevo</title>

  <!-- canvas -->
  <rect width="1280" height="320" fill="#FDFDFC"/>

  <!-- ghost mark: balances the right field, one idea only -->
  <g transform="translate(1030,-40)" opacity="0.05">
    <rect width="320" height="320" rx="56" fill="none" stroke="#1B1B18" stroke-width="10"/>
    <rect x="87" y="73" width="32" height="174" rx="4" fill="#1B1B18"/>
    <path d="M144 165 h40 v-43 h43 v-43" fill="none" stroke="#1B1B18" stroke-width="32" stroke-linecap="square"/>
    <path d="M151 194 L227 252" fill="none" stroke="#1B1B18" stroke-width="32" stroke-linecap="square"/>
  </g>

  <!-- brand mark: stem, rising milestone steps, forward leg -->
  <g transform="translate(96,72)">
    <rect width="176" height="176" rx="28" fill="#F53003"/>
    <rect x="48" y="40" width="18" height="96" rx="2" fill="#FFFFFF"/>
    <path d="M80 92 h22 v-24 h24 v-24" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M80 106 L128 142" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="square"/>
  </g>

  <!-- text column: every left edge aligns at x=344 -->
  <text x="344" y="86" font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="3.5" fill="#6F6F68">PERSONAL OPERATING SYSTEM</text>
  <text x="340" y="178" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#1B1B18">Kinevo</text>
  <text x="344" y="222" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#55534E">Plan. Schedule. Focus. Adapt.</text>

  <!-- the product argument: one deterministic chain, no boxes -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2" fill="#1B1B18">
    <text x="346" y="268">GOAL</text>
    <text x="416" y="268" fill="#F53003">&#8594;</text>
    <text x="452" y="268">BREAKDOWN</text>
    <text x="572" y="268" fill="#F53003">&#8594;</text>
    <text x="608" y="268">SCHEDULE</text>
    <text x="712" y="268" fill="#F53003">&#8594;</text>
    <text x="748" y="268">TODAY</text>
    <text x="818" y="268" fill="#F53003">&#8594;</text>
    <text x="854" y="268">ADAPT</text>
  </g>
</svg>
